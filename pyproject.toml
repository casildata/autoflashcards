[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autoflashcards"
version = "0.1.0.dev0"
description = "Turn PDFs, slides and notes into Anki-ready flashcard decks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Casildo" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
autoflashcards = "autoflashcards.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
