[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autoflashcards"
version = "0.1.0.dev0"
description = "Turn PDFs, slides and notes into Anki-ready flashcard decks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Casildo" }]
requires-python = ">=3.11"
dependencies = [
    "genanki>=0.13",
    "markdown-it-py>=3",
    "pdfplumber>=0.11",
    "pillow>=10.1",  # diagram card images (pdfplumber already needs it)
    "pypdfium2>=5.9",  # draws diagram figures without the slide background (pdfplumber already needs it)
    "rapidfuzz>=3",
    "rich>=13.8",  # progress bars (typer already needs it)
    "typer>=0.12",
]

[project.optional-dependencies]
ai = ["anthropic>=2.3", "pydantic>=2"]  # --ai claude (pydantic also for --ai ollama)
dev = [
    "anthropic>=2.3",  # same as [ai], so the AI stage is tested
    "pydantic>=2",
    "pytest>=8",
    "reportlab>=4",  # builds the test PDFs
    "ruff>=0.6",
]

[project.scripts]
autoflashcards = "autoflashcards.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["eval"]  # tests import the eval scorer
# genanki's cached-property dependency uses an asyncio API deprecated in Python 3.14
filterwarnings = ["ignore::DeprecationWarning:cached_property"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
